name: Build Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-lock.txt
      - run: .\.venv\Scripts\python.exe -m unittest scripts.test_desktop scripts.test_modes -v
      - run: choco install wixtoolset --version=3.14.1 -y --no-progress
      - shell: powershell
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Projet4-AgentIA-Windows
          path: |
            dist/AgentScreen.exe
            dist/Projet4-AgentIA-*.msi
            dist/SHA256SUMS.txt
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Projet 4, agent IA $tag" --notes-file CHANGELOG.md }
          gh release upload $tag dist/AgentScreen.exe (Get-ChildItem dist/Projet4-AgentIA-*.msi).FullName dist/SHA256SUMS.txt --clobber
