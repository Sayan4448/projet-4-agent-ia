name: Build Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-lock.txt
      - run: .\.venv\Scripts\python.exe -m unittest discover -s scripts -p "test_*.py" -v
      - run: .\.venv\Scripts\python.exe -m pip check
      - name: Ensure WiX 3 tools
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe")) {
            choco install wixtoolset --version=3.14.1.20250415 -y --no-progress
          }
      - shell: powershell
        run: ./scripts/build_windows.ps1
      - name: Smoke test packaged browser
        shell: pwsh
        run: |
          & .\dist\AgentScreen.exe --self-test-browser "$env:TEMP\projet4-browser-check.json"
          Get-Content "$env:TEMP\projet4-browser-check.json" -ErrorAction SilentlyContinue
          if ($LASTEXITCODE -ne 0) { throw "Packaged browser self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: Projet4-AgentIA-Windows
          path: |
            dist/AgentScreen.exe
            dist/Projet4-AgentIA-*.msi
            dist/SHA256SUMS.txt
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if (-not $exists) { gh release create $tag --title "Projet 4, agent IA $tag" --notes-file CHANGELOG.md }
          gh release upload $tag dist/AgentScreen.exe (Get-ChildItem dist/Projet4-AgentIA-*.msi).FullName dist/SHA256SUMS.txt --clobber
